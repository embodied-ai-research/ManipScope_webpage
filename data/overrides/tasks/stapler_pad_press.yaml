# Paper Appendix C.1: instruction delivery differs between policies and agents on this task.
delivery_note: >-
  Instruction delivery differs between system groups on this task. Learned policies receive
  oracle-staged instructions (STAPLER_STAGED_INSTRUCTION=1): the instruction switches to the second
  stage once stage 1 succeeds. The two agents (GPT-6, Gemini 3.8 Flash) receive the complete compound
  instruction from the start (STAPLER_STAGED_INSTRUCTION=0); GPT-6's rerun under this setting remains
  4/5. Seeds, success predicate and step limit are unchanged, but agent and policy numbers on this
  scene are not measured under identical instruction conditions.

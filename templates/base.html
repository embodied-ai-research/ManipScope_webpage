<!DOCTYPE html>
<html lang="{{lang}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | {{site_name}} Docs</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="icon" href="{{rel}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{rel}}assets/css/style.css?v={{asset_v}}">
<script>
  (function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="header">
  <div class="header-inner">
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="brand" href="{{rel}}">
      <img src="{{rel}}assets/img/logo.svg" alt="" width="28" height="28">
      <span>{{site_name}}</span>
    </a>
    <div class="search">
      <input id="search-input" type="search" placeholder="Search docs…" aria-label="Search" autocomplete="off">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <nav class="header-links">
      {{header_links}}
      <button class="language-toggle" type="button" aria-label="Switch to Chinese" data-i18n-skip><span lang="en">EN</span><span aria-hidden="true"> / </span><span lang="zh-CN">&#20013;&#25991;</span></button>
      <button class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">{{sidebar}}</nav>
  </aside>
  <main class="main" id="main">
    <article class="content">
      {{content}}
    </article>
    <footer class="footer">
      <div>{{footer_left}}</div>
    </footer>
  </main>
  <aside class="toc" id="toc">{{toc}}</aside>
</div>
<script>window.__REL__ = "{{rel}}"; window.__CLEAN_URLS__ = {{clean_urls}};</script>
<script src="{{rel}}assets/js/translations-zh.js?v={{asset_v}}" defer></script>
<script src="{{rel}}assets/js/i18n.js?v={{asset_v}}" defer></script>
<script src="{{rel}}assets/js/main.js?v={{asset_v}}" defer></script>
{{extra_scripts}}
</body>
</html>

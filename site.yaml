# Site-wide configuration for the ManiScope documentation site.
# Everything marked TODO is a placeholder that must be filled before publishing.

site:
  # The paper and the repository README use "ManipScope"; the directory name is ManiScope.
  name: ManipScope
  short_name: ManipScope
  tagline: An evaluation-only diagnostic benchmark for robotic instruction following under changed task requirements
  description: >
    ManipScope is an evaluation-only diagnostic benchmark for robotic instruction following under
    changed task requirements, built on RoboTwin 2.0: 48 held-out scenes in six task families, 100 frozen
    initial states per scene, task-success and selection metrics, and language-following diagnostics
    (failure decomposition, target reassignment and its controls) that run on any policy.
  # Leave empty for relative links (works from file:// and any sub-path); set e.g. "/doc" when deploying under a prefix.
  base_url: ""
  # false → links end in ".../index.html" and work when the site is opened straight from disk (file://)
  # or on hosts without directory-index fallback. true → clean ".../" URLs (needs a web server).
  clean_urls: false
  # Double-blind mode: hides authors, affiliations, citation, repository/email/community links and
  # the header GitHub button. Paper / Code buttons link back to this page.
  anonymous: false
  language: en
  date: "Nov 2026"            # revision release
  # Protocol version as a decorative label (home-page kicker, footer). Empty hides both; the
  # leaderboard still states the paper's code freeze, which is provenance rather than a badge.
  version: ""
  venue: ""                   # not rendered; fill in once the publication venue is announced

links:
  # Empty renders a "Paper · coming soon" chip. Fill in once the preprint has an identifier;
  # do not invent one.
  paper: ""
  # Benchmark repository, public since 2026-11-21. Empty renders a "coming soon" chip instead.
  code: "https://github.com/USTC-AIR-Lab/ManiScope"
  leaderboard: "leaderboard/"
  # Empty hides the Email row. The Participate page carries the contact route for evaluations;
  # set a contact address here if the site should show one.
  email: ""
  upstream_robotwin: "https://github.com/RoboTwin-Platform/RoboTwin"
  community: "community/"
  # Submission entry point: evaluation requests and result pull requests are filed in this
  # repository, which is public, so the link works regardless of the benchmark repository's state.
  submit: "https://github.com/embodied-ai-research/ManipScope_webpage/issues/new/choose"
  # Protocol and tooling live with the benchmark code.
  protocol_doc: "https://github.com/USTC-AIR-Lab/ManiScope/blob/main/docs/SUBMISSIONS.md"

paper:
  title: "ManipScope: A Diagnostic Benchmark for Instruction Following and Generalization in Robotic Manipulation"
  # Author order and affiliation indices as in main_arxiv.tex; do not re-map them here.
  authors:
    - {name: "Jiacheng Li", affil: "1,2", homepage: "https://embodied-ai-research.github.io/"}
    - {name: "Yaping Li", affil: "2,5", homepage: "https://li-yaping.github.io/"}
    - {name: "Congsheng Xu", affil: "2,3", homepage: "https://acondaway.github.io/"}
    - {name: "Qingchen Liu", affil: "1"}
    - {name: "Haonan Wang", affil: "2"}
    - {name: "Zhijie Deng", affil: "4", mark: "*"}
    - {name: "Jiahu Qin", affil: "1", mark: "*"}
  affiliations:
    - {id: "1", name: "AIR Lab, University of Science and Technology of China"}
    - {id: "2", name: "Sharpa Robotics"}
    - {id: "3", name: "Shanghai Jiao Tong University"}
    - {id: "4", name: "SJTU-Sharpa Joint Lab for Embodied AI, SJTU"}
    - {id: "5", name: "The Chinese University of Hong Kong"}
  institution_logos:
    - name: "University of Science and Technology of China"
      href: "https://www.ustc.edu.cn/"
      image: "assets/img/institutions/ustc.svg"
      source: "https://www.ustc.edu.cn/news/images/logo.svg"
    - name: "Sharpa Robotics"
      href: "https://www.sharpa.com/"
      image: "assets/img/institutions/sharpa.svg"
      source: "https://www.sharpa.com/cdn/shop/t/53/assets/sa-header-logo-dark.svg?v=71615509824511315781788967771"
    - name: "Shanghai Jiao Tong University"
      href: "https://www.sjtu.edu.cn/"
      image: "assets/img/institutions/sjtu.svg"
      source: "https://www.sjtu.edu.cn/resource/assets/img/svg/Min-logo-pic.svg"
      seal: true
    - name: "The Chinese University of Hong Kong"
      href: "https://www.cuhk.edu.hk/english/"
      image: "assets/img/institutions/cuhk.png"
      source: "https://www.cuhk.edu.hk/english/images/cuhk_logo_2x.png?20221027"
  marks: "* Co-corresponding authors"
  # No arXiv identifier has been confirmed, so none is stated here.
  bibtex: |
    @misc{li2026manipscope,
      title  = {ManipScope: A Diagnostic Benchmark for Instruction Following and Generalization in Robotic Manipulation},
      author = {Li, Jiacheng and Li, Yaping and Xu, Congsheng and Liu, Qingchen and
                Wang, Haonan and Deng, Zhijie and Qin, Jiahu},
      year   = {2026},
      note   = {Preprint; arXiv identifier to be added}
    }

leaderboard:
  # Policy display names (as they appear in data/leaderboard.json) to hide from public tables.
  exclude:
    - "WLA(内部误用)"      # internal mis-used joint-interface integration; excluded from the paper. Public WLA = "WLA".
  # Display-name normalisation to match the paper.
  rename:
    "GPT-6 Astra(high)": "GPT-6 Astra"
    "Gemini 3.8 Flash(high)": "Gemini 3.8 Flash"
    "GalaxeaVLA(G0.5)": "GalaxeaVLA (G0.5)"
    "StarVLA": "StarVLA (Qwen3-VL-OFT)"
    "Pi0.5": "π0.5"
    "pi0": "π0"
  # Systems listed on the separate Agents leaderboard (language-model agent with tools/controller).
  agents:
    - "GPT-6 Astra"
    - "GPT-6.2 Astra"
    - "Opus 5.5"
    - "Gemini 4 Argon"
    - "Gemini 3.8 Flash"
  # Row order of the policy tables and column order of the per-scene matrix = paper Table 1 / Tables 11-13.
  # Names not listed here are appended in data order.
  order:
    - "DM0.5"
    - "π0.5"
    - "StarVLA (Qwen3-VL-OFT)"
    - "FastWAM"
    - "π0"
    - "AHA-WAM"
    - "X-VLA"
    - "WLA"
    - "GalaxeaVLA (G0.5)"
    - "X-WAM"
    - "Motus"
    - "LingBot-VA"
    - "GPT-6 Astra"
    - "GPT-6.2 Astra"
    - "Opus 5.5"
    - "Gemini 4 Argon"
    - "Gemini 3.8 Flash"

